<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise11</title>
    <link rel="stylesheet" href="exercise11.css">
</head>

<body style="padding: 500px 0px;">
    <div style="
        display: grid;
        grid-template-columns: 200px 75px;
        ">
        <div style="background-color: lightblue;">200px</div>
        <div style="background-color: lightcoral;">75px</div>
    </div>
    <hr>

    <div style="
        display: grid;
        grid-template-columns: 50px 1fr 75px 100px;
        ">
        <div style="background-color: lightblue;">Col1</div>
        <div style="background-color: lightcoral;">Col2</div>
        <div style="background-color: rgb(252, 252, 39);">Col3</div>
        <div style="background-color: rgb(25, 252, 39);">Col4</div>
    </div>
    <hr>

    <div style="
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        column-gap: 20px;
        row-gap: 10px;
        ">
        <div style="background-color: lightcoral;">Col1</div>
        <div style="background-color: lightcoral;">Col2</div>
        <div style="background-color: lightcoral;">Col3</div>
        <div style="background-color: lightcoral;">Col4</div>
        <div style="background-color: lightcoral;">Col1</div>
        <div style="background-color: lightcoral;">Col2</div>
        <div style="background-color: lightcoral;">Col3</div>
        <div style="background-color: lightcoral;">Col4</div>
    </div>
    <hr>





    <div class="face-cards">

        <div class="profile">
            <img class="image" src="exercisesPictures/avatar.png" alt="animal-picture">
            <div class="pics-about">
                <p style="font-weight: bold">Billa</p>
                <p style="margin-bottom: 10px;">2 mutual friends</p>
                <button>Add Friend</button>
            </div>
        </div>

        <div class="profile">
            <img class="image" src="exercisesPictures/avatar2.png" alt="animal-picture">
            <div class="pics-about">
                <p style="font-weight: bold">Bhondu</p>
                <p style="margin-bottom: 10px;">4 mutual friends</p>
                <button>Add Friend</button>
            </div>
        </div>

        <div class="profile">
            <img class="image" src="exercisesPictures/avatar3.png" alt="animal-picture">
            <div class="pics-about">
                <p style="font-weight: bold">Cutu</p>
                <p style="margin-bottom: 10px;">5 mutual friends</p>
                <button>Add Friend</button>
            </div>
        </div>

    </div>

</body>

</html>
