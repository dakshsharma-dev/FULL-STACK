<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise9</title>
    <style>
        .container1{
            background-color: red;
            width: 50px;
            height: 50px;
            margin-bottom: 20px;
        }

        .container2{
            background-color: black;
            width: 50px;
            height: 50px;
            border-radius: 30px;
            margin-bottom: 20px;
        }

        .container3{
            width: 300px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            padding: 10px;
            margin-bottom: 20px;
        }
        .feedback{
            margin-top: 0px;
            margin-left: 10px;
        }

        .container4{
            font-family: Arial, Helvetica, sans-serif;
            width: 300px;
            color: white;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 0px 20px;
            border: 1px solid rgba(255, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        .install{
            font-weight: bold;
            font-size: 20px;
        }
        .music{
            color: grey
        } 

        .container5{
            font-family: Arial, Helvetica, sans-serif;
        }
        .inside5{
            display: inline-block;
            margin-right: 20px;
            box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.8);
        }
        .image1{
            width: 200px;
            height: 200px;
        }
        .image2{
            width: 200px;
        }
        .image3{
            width: 200px;
            height: 200px;
        }
        .friend{
            color: white;
            background-color: rgb(35, 151, 228);
            border: none;
            border-radius: 2px;
            padding: 6px;
            cursor: pointer;
        }
        .pics-about{
            margin-left: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container1"></div>
    <div class="container2"></div>
    <div class="container3">
        <p class="feedback">Happy with our product?</p>
        <button style="margin-left: 10px;">Yes</button>
        <button>No</button>
    </div>
    <div class="container4">
        <p class="install">Install YouTube Music</p>
        <p class="music">Add YouTube music to your desktop for quick and easy access</p>
    </div>
    <div class="container5">
        <div class="inside5">
            <img class="image1" src="exercisesPictures/avatar.png" alt="animal-picture">
            <div class="pics-about">
                <p style="margin: 5px; font-weight: bold">Billa</p>
                <p style="margin: 5px;">2 mutual friends</p>
                <button class="friend">Add Friend</button>
            </div>
            
        </div>
        <div class="inside5">
            <img class="image2" src="exercisesPictures/avatar2.png" alt="animal-picture">
            <div class="pics-about">
                <p style="margin: 5px; font-weight: bold">Bhondu</p>
                <p style="margin: 5px;">4 mutual friends</p>
                <button class="friend">Add Friend</button>
            </div>
        </div>
        <div class="inside5">
            <img class="image3" src="exercisesPictures/avatar3.png" alt="animal-picture">
            <div class="pics-about">
                <p style="margin: 5px; font-weight: bold">Cutu</p>
                <p style="margin: 5px;">5 mutual friends</p>
                <button class="friend">Add Friend</button>
            </div>
        </div>
    </div>
</body>
</html>
