<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .subscribe-button{
            color: white;
            background-color: rgb(206, 10, 10);
            border: none;
            height: 35px;
            width: 100px;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 8px;
        }
        .join-button{
            color: rgb(0, 173, 241);
            background-color: white;
            height: 35px;
            width: 60px;
            border-radius: 2px;
            border-width: 1px;
            border-style: solid;
            border-color: rgb(0, 170, 237);
            cursor: pointer;
        }
        .tweet-button{
            color: white;
            font-weight: bold;
            font-size: 15px;
            background-color: rgb(5, 165, 228);
            height: 35px;
            width: 70px;
            border: none;
            border-radius: 20px;
            margin-left: 8px;
            cursor: pointer;
        }
        .apply{
            color: white;
            font-weight: bold;
            background-color: rgb(10, 102, 194);
            height: 35px;
            width: 220px;
            border: none;
            border-radius: 20px;
            margin-left: 8px;
            cursor: pointer;
        }
        .save-button{
            border-radius: 20px;
            font-weight: bold;
            width: 70px;
        }
        .cart-button{
            color: black;
            background-color: rgb(255, 216, 20);
            width: 200px;
            margin-top: 8px;
        }
        .get-started-button{
            background-color: rgb(121, 82, 179);
            font-weight: bold;
            margin-left: 8px;
        }
        .download-button{
            color: rgb(121, 82, 179);
            width: 100px;
            border-color: rgb(121, 82, 179);
        }
        .request-button{
            background-color: black;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <button class="subscribe-button">SUBSCRIBE</button>
    <button class="join-button">JOIN</button>
    <button class="tweet-button">Tweet</button>
    <button class="apply">Apply on company website</button>
    <button class="join-button save-button">Save</button>
    <button class="tweet-button cart-button">Add to Cart</button>
    <button class="subscribe-button get-started-button">Get started</button>
    <button class="join-button download-button">Download</button>
    <button class="subscribe-button request-button">Request now</button>
</body>
</html>
