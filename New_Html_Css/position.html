<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position Practice</title>
</head>

<body style="
        padding-bottom: 1000px;
        padding-top: 60px;
        padding-left: 70px;
    ">
    
    <div style="
        color: white;
        background-color: black;
        position: fixed;
        top: 0px;
        left: 0px;
        right: 0px;
        height: 50px;
        z-index: 1;
    ">Header</div>

    <div style="
        position: absolute;
        background-color: red;
        color: white;
        right: 10px;
        top: 0px;
        z-index: 2;
    ">absolute</div>

    <div style="
        background-color: green;
        color: white;
        position: fixed;
        left: 0px;
        top: 50px;
        bottom: 0px;
        width: 70px;
    ">sidebar
        <div style="
            position: absolute;
            background-color: red;
            color: white;
            right: 0px;
            top: 0px;
        ">X</div>
    </div>


    <div style="
        background-color: lightblue;
        height: 200px;
        width: 200px;
    ">div 1</div>

    <div style="
        background-color: lightcoral;
        height: 200px;
        width: 200px;
        position: relative;
    ">div 2
        <div style="
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: white;
        ">01:45</div>
    </div>
</body>

</html>
